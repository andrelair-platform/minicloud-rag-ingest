name: CI

# ghcr-only (Harbor decommissioned 2026-11-16). Build+push to ghcr + cosign/SBOM. Login via GITOPS_TOKEN
# (write:packages; the package is linked to minicloud-gitops from the decommission crane-copy). The old
# Harbor auto-bump is dropped (it sed'd manifests/ paths LOT E moved to platform/+is/; dead since 2026-10).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GHCR_IMAGE: ghcr.io/andrelair-platform/rag-ingest

jobs:
  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute build metadata
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "image_tag=${SHA}-amd64" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: AndreLiar
          password: ${{ secrets.GITOPS_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and push to ghcr
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.GHCR_IMAGE }}:${{ steps.meta.outputs.image_tag }}
          build-args: |
            CA_CERT=${{ secrets.MINICLOUD_CA_CERT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
          timeout: 15m
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Sign image + attach SBOM (keyless)
        run: |
          cosign sign --yes "${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}"
          syft "${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}" -o cyclonedx-json=sbom.json
          cosign attach sbom --sbom sbom.json --type cyclonedx "${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}"
